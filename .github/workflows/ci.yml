name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Capar.slnx

      # Warnings are errors, and EnforceCodeStyleInBuild puts analyzer style into this step too.
      - name: Build
        run: dotnet build Capar.slnx --configuration Release --no-restore

      # Whitespace and style only. The analyzer pass of dotnet format builds its own workspace without
      # running source generators, so it reports generated types as missing; the build above already
      # enforces analyzer style.
      - name: Verify formatting
        run: |
          dotnet format whitespace Capar.slnx --verify-no-changes --no-restore
          dotnet format style Capar.slnx --verify-no-changes --no-restore

      # Drives the generator through CSharpGeneratorDriver: diagnostics, emitted code that has to compile,
      # determinism, discovery across project references, and whether the incremental cache is really hit.
      - name: Generator tests
        run: dotnet run --project tests/Capar.SourceGenerator.Tests --configuration Release --no-build

      # The same scenario source compiled against MediatR 12.5.0 and against Capar, outcomes compared.
      - name: Differential tests against MediatR 12.5.0
        run: dotnet run --project tests/Capar.DifferentialTests --configuration Release --no-build

  licences:
    name: dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Capar.slnx

      # Reads the licence terms of every package in the tree, at every depth, from the restored packages on
      # disk. MediatR 13 and later would fail here, which is the point: the 12.5.0 baseline is pinned on
      # purpose and this keeps it that way.
      - name: Audit
        run: dotnet run --project tools/Capar.LicenseAudit --configuration Release -- .

  nativeaot:
    name: NativeAOT sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Publishing with NativeAOT runs the trim and AOT analysis over Capar's runtime and the code the generator
      # wrote for the sample. Warnings are errors, so any reflection left on a dispatch path fails here.
      - name: Publish
        run: dotnet publish samples/Capar.Samples.Aot --configuration Release --runtime linux-x64 --output aot

      # The binary checks every kind of dispatch and exits non-zero on a wrong answer.
      - name: Run
        run: ./aot/Capar.Samples.Aot

      - name: Binary size
        run: ls -l aot/Capar.Samples.Aot

  package:
    name: package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Packs both packages into a local feed and builds a new application against the .nupkg files, with no
      # project references. Every other job uses project references, which hide packaging mistakes.
      - name: Pack, install and run
        run: bash eng/package-smoke.sh

  benchmarks:
    name: benchmark sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Proves every scenario reaches its handler, behaviours and listeners, then runs each benchmark once.
      # Shared runners are far too noisy for nanosecond claims; real numbers come from named hardware and
      # are committed under docs/benchmark-results.
      - name: Sanity
        run: dotnet run -c Release --project benchmarks/Capar.Benchmarks -- --sanity

      - name: Dry run
        run: dotnet run -c Release --project benchmarks/Capar.Benchmarks -- --filter '*' --job Dry
