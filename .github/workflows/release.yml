name: release

# Runs only on a version tag. Nothing here runs on pushes or pull requests, and the step that publishes to
# NuGet waits for a person: the "nuget" environment requires an approval before its job starts. RELEASING.md
# is the checklist, including the one-time setup on nuget.org.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  pack:
    name: pack and check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # v1.2.3 or v1.2.3-rc.1 becomes the package version; anything else stops the release here.
      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Not a version: $GITHUB_REF_NAME" >&2; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          dotnet build Capar.slnx --configuration Release
          dotnet run --project tests/Capar.SourceGenerator.Tests --configuration Release --no-build
          dotnet run --project tests/Capar.DifferentialTests --configuration Release --no-build
          dotnet run --project tests/Capar.Samples.Web.Tests --configuration Release --no-build

      # Packs with the release version, installs the packages into a new application and runs it.
      - name: Pack and smoke test
        run: CAPAR_VERSION="${{ steps.version.outputs.version }}" bash eng/package-smoke.sh

      # SourceLink, deterministic build and compiler flags, checked on the packages themselves.
      - name: Validate packages
        run: |
          dotnet tool install --global dotnet-validate --version 0.0.1-preview.582
          for package in artifacts/smoke-feed/*.nupkg; do dotnet validate package local "$package"; done

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/smoke-feed/*
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      # The release notes are the CHANGELOG section for this version. A pre-release version makes a pre-release.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          awk -v header="## [$VERSION]" 'index($0, header) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > notes.md
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" packages/* --title "Çapar $VERSION" --notes-file notes.md $prerelease

  nuget:
    name: publish to NuGet
    needs: [pack, github-release]
    runs-on: ubuntu-latest
    # The environment's required reviewers approve this job before it starts.
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Trusted publishing: a short-lived key in exchange for this workflow's identity, no stored secret.
      - name: NuGet login
        id: login
        # Pinned to a commit: this step mints the key that can publish the packages. Dependabot proposes updates.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
