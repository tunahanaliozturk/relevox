name: Feature request
description: Something Relevox could do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The problem first, then the API you have in mind if you have one.
    validations:
      required: true
  - type: textarea
    id: mediatr
    attributes:
      label: How MediatR handles it
      description: Relevox keeps MediatR 12's behaviour unless there is a reason not to. If MediatR does this, say how.
