name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Relevox.slnx

      # Warnings are errors, and EnforceCodeStyleInBuild puts analyzer style into this step too.
      - name: Build
        run: dotnet build Relevox.slnx --configuration Release --no-restore

      # Whitespace and style only. The analyzer pass of dotnet format builds its own workspace without
      # running source generators, so it reports generated types as missing; the build above already
      # enforces analyzer style.
      - name: Verify formatting
        run: |
          dotnet format whitespace Relevox.slnx --verify-no-changes --no-restore
          dotnet format style Relevox.slnx --verify-no-changes --no-restore

      # Drives the generator through CSharpGeneratorDriver: diagnostics, emitted code that has to compile,
      # determinism, discovery across project references, and whether the incremental cache is really hit.
      - name: Generator tests
        run: dotnet run --project tests/Relevox.SourceGenerator.Tests --configuration Release --no-build

      # The same scenario source compiled against MediatR 12.5.0 and against Relevox, outcomes compared.
      - name: Differential tests against MediatR 12.5.0
        run: dotnet run --project tests/Relevox.DifferentialTests --configuration Release --no-build

      # An ASP.NET Core minimal API on Relevox, driven over HTTP in process: a scope per request, scoped services in
      # handlers and behaviours, problem details from exceptions, a streamed response, concurrent requests.
      - name: Web sample tests
        run: dotnet run --project tests/Relevox.Samples.Web.Tests --configuration Release --no-build

      # Relevox.Testing: the fake mediator on its own, and the recorder in front of a real generated mediator.
      - name: Testing package tests
        run: dotnet run --project tests/Relevox.Testing.Tests --configuration Release --no-build

      # Relevox.FluentValidation: the behaviour, closed at build time over the requests with a validator.
      - name: FluentValidation package tests
        run: dotnet run --project tests/Relevox.FluentValidation.Tests --configuration Release --no-build

      # The same order service on MediatR 12.5 and moved to Relevox by following docs/migration.md. Both print
      # what they did; any difference in the transcripts fails the build.
      - name: Migration sample prints the same before and after
        run: |
          dotnet run --project samples/Migration/Before/App --configuration Release --no-build > before.txt
          dotnet run --project samples/Migration/After/App --configuration Release --no-build > after.txt
          diff before.txt after.txt
          cat after.txt

  licences:
    name: dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Relevox.slnx

      # Reads the licence terms of every package in the tree, at every depth, from the restored packages on
      # disk. MediatR 13 and later would fail here, which is the point: the 12.5.0 baseline is pinned on
      # purpose and this keeps it that way.
      - name: Audit
        run: dotnet run --project tools/Relevox.LicenseAudit --configuration Release -- .

  nativeaot:
    name: NativeAOT sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Publishing with NativeAOT runs the trim and AOT analysis over Relevox's runtime and the code the generator
      # wrote for the sample. Warnings are errors, so any reflection left on a dispatch path fails here.
      - name: Publish
        run: dotnet publish samples/Relevox.Samples.Aot --configuration Release --runtime linux-x64 --output aot

      # The binary checks every kind of dispatch and exits non-zero on a wrong answer.
      - name: Run
        run: ./aot/Relevox.Samples.Aot

      - name: Binary size
        run: ls -l aot/Relevox.Samples.Aot

  package:
    name: package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Packs both packages into a local feed and builds a new application against the .nupkg files, with no
      # project references. Every other job uses project references, which hide packaging mistakes.
      - name: Pack, install and run
        run: bash eng/package-smoke.sh

      # The check docs/message-map.md tells users to add, on the smoke application, whose map is committed.
      - name: Build the smoke application with its committed message map
        run: dotnet build tests/Relevox.PackageSmoke --configuration Release -p:RelevoxMessageMap=true -p:RelevoxMessageMapPath=message-map.json

      - name: The message map is up to date
        run: |
          if [ -n "$(git status --porcelain -- '*message-map.json' '*message-map.md')" ]; then
            git --no-pager diff -- '*message-map.json' '*message-map.md'
            echo "::error::The message map changed. Build, then commit message-map.json and message-map.md."
            exit 1
          fi

      # And the same check fails once the code moves: a line added above every call shifts their call sites.
      - name: The check catches a stale map
        run: |
          sed -i '1i // A line that moves every call site down.' tests/Relevox.PackageSmoke/Program.cs
          dotnet build tests/Relevox.PackageSmoke --configuration Release -p:RelevoxMessageMap=true -p:RelevoxMessageMapPath=message-map.json
          if [ -z "$(git status --porcelain -- '*message-map.json' '*message-map.md')" ]; then
            echo "::error::The map did not change after the code moved; the check would never fail."
            exit 1
          fi
          git checkout -- tests/Relevox.PackageSmoke

      # SourceLink, deterministic build and compiler flags, read from the packages. The release workflow runs the
      # same check on the packages it is about to publish.
      - name: Validate packages
        run: |
          dotnet tool install --global dotnet-validate --version 0.0.1-preview.582
          for package in artifacts/smoke-feed/*.nupkg; do dotnet validate package local "$package"; done

  benchmarks:
    name: benchmark sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Proves every scenario reaches its handler, behaviours and listeners, then runs each benchmark once.
      # Shared runners are far too noisy for nanosecond claims; real numbers come from named hardware and
      # are committed under docs/benchmark-results.
      - name: Sanity
        run: |
          dotnet run -c Release --project benchmarks/Relevox.Benchmarks -- --sanity
          dotnet run -c Release --project benchmarks/Relevox.Benchmarks.Scale -- --sanity

      - name: Dry run
        run: dotnet run -c Release --project benchmarks/Relevox.Benchmarks -- --filter '*' --job Dry
