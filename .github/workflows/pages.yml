name: pages

# Publishes the documentation site, https://tunahanaliozturk.github.io/relevox/, from main. The build job of ci.yml
# builds and link-checks the same site on every pull request; this workflow only publishes what main has.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - tools/site.py
      - tools/site.css
      - tools/site-requirements.txt
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, and a newer push waits for the one in flight rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and check links
        run: |
          python3 -m venv "$RUNNER_TEMP/site-venv"
          "$RUNNER_TEMP/site-venv/bin/pip" install --require-hashes -r tools/site-requirements.txt
          "$RUNNER_TEMP/site-venv/bin/python" tools/site.py "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: deploy site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
